<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>(function(){var d=document.documentElement;try{var m=localStorage.getItem("railway-theme");d.dataset.theme=m==="light"||m==="dark"?m:matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"}catch(e){d.dataset.theme="dark"}})();</script>
    <title>Regex Railway — see how a regex thinks</title>
    <meta
      name="description"
      content="Turn any regular expression into a metro map and watch a train match it against your text, step by step. Plain-English explanations, backtracking visualised, ReDoS detection."
    />
    <meta name="author" content="Harut Andreasyan" />
    <meta name="theme-color" content="#0a0e1a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f3ea" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Regex Railway — see how a regex thinks" />
    <meta
      property="og:description"
      content="A regex becomes a metro map, and a train shows every step of the match."
    />
    <meta property="og:image" content="https://regex-railway.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://regex-railway.vercel.app/" />
    <meta name="twitter:image" content="https://regex-railway.vercel.app/og.png" />
    <link rel="canonical" href="https://regex-railway.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
